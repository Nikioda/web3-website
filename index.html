<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vkon Motor Starter Panel — 3D Replica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <canvas id="canvas3d"></canvas>

    <!-- Top Header Badge -->
    <header class="top-nav">
      <div class="brand-badge">
        <div class="brand-dot"></div>
        <div class="brand-info">
          <span class="brand-title">VKON AUTOMATION</span>
          <span class="brand-subtitle">SASD 1/2/3 Control Panel · 3D Replica</span>
        </div>
      </div>
      <div class="status-pill" id="systemStatusPill">
        <span class="status-dot green"></span>
        <span class="status-text">MAINS HEALTHY · 415V</span>
      </div>
    </header>

    <!-- Bottom Interactive Control Dock -->
    <div class="control-dock">
      <button class="dock-btn active" id="btnFront" title="Front Faceplate View">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="1.5"/><circle cx="16" cy="8" r="1.5"/></svg>
        <span>Front</span>
      </button>

      <button class="dock-btn" id="btnToggleDoor" title="Open / Close Panel Door">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V5a2 2 0 012-2h10a2 2 0 012 2v16"/><path d="M15 12v.01"/></svg>
        <span id="doorBtnLabel">Open Door</span>
      </button>

      <button class="dock-btn" id="btnInside" title="Inspect Internal Components">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        <span>Internals</span>
      </button>

      <button class="dock-btn" id="btnBack" title="Rear Wall Mount View">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="7" cy="7" r="1"/><circle cx="17" cy="7" r="1"/><circle cx="12" cy="17" r="1"/></svg>
        <span>Back</span>
      </button>

      <button class="dock-btn" id="btnRotate" title="Toggle Auto-Rotation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 11-.57-8.38l5.67-5.67"/></svg>
        <span>Rotate</span>
      </button>

      <div class="dock-divider"></div>

      <button class="dock-btn power-btn" id="btnPowerToggle" title="Click to Toggle Motor Power">
        <span class="power-indicator"></span>
        <span id="powerBtnLabel">Motor ON</span>
      </button>
    </div>

    <!-- Quick Tooltip / Interaction Hints -->
    <div class="interaction-hints">
      <span>🖱️ Drag to Rotate · Scroll to Zoom · Double-Click to Open/Close Door</span>
    </div>
  </div>

  <!-- Three.js + OrbitControls + GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
